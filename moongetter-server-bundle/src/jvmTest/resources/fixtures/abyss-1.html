          position: absolute;

<script>
    function getParameterByName(name) {
        var url = window.location.href;
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        var results = regex.exec(url);
        return results ? decodeURIComponent(results[2].replace(/\+/g, ' ')) : null;
    }

    var slug = getParameterByName('v');
    var playerDiv = document.getElementById('player-abyss');
    var camada = document.getElementById('trigger');

    if(slug) {
        playerDiv.innerHTML = `<iframe src="https://abysscdn.com/?v=${slug}" allowfullscreen scrolling="no"></iframe>`;
        camada.addEventListener('mousedown', function(e) {
            this.style.display = 'none';
        });

        camada.addEventListener('touchstart', function() {
            this.style.display = 'none';
        }, {passive: true});

    } else {
        window.location.href = 'https://www.google.com/';
    }
</script>
